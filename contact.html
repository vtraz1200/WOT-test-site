      <section class="section-contact">
        <form
          class="form"
          action="https://api.web3forms.com/submit"
          method="POST"
          autocomplete="off"
        >
          <input
            type="hidden"
            name="access_key"
            value="26408754-11fc-47ae-ba6e-036a18819a21"
          />

          <div class="footer-card">
            <div>
              <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5857.403363686871!2d-83.24094962334446!3d42.77351397115751!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8824edfdf1669f75%3A0x7de18c55a854962d!2sWide%20Open%20Throttle%20LLC!5e0!3m2!1sen!2sus!4v1766019317782!5m2!1sen!2sus"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                class="footer-map"
              ></iframe>
            </div>
            <div>
              <div class="footer-card-head">
                <h2 class="footer-card-title">Contact Us</h2>
                <p class="footer-card-subtitle">
                  Tell us what you want done — we’ll respond within 24 hours.
                </p>
              </div>

              <div class="footer-card-info">
                <div class="footer-card-firlas-name-cont">
                  <input
                    name="first_name"
                    class="footer-input-form-card"
                    type="text"
                    id="first_name"
                    placeholder="First Name"
                  />
                  <input
                    name="last_name"
                    class="footer-input-form-card"
                    type="text"
                    id="last_name"
                    placeholder="Last Name"
                  />
                </div>

                <input
                  name="phone_number"
                  class="footer-input-form-card-two"
                  type="tel"
                  id="phone"
                  placeholder="Phone Number"
                />

                <input
                  name="email"
                  class="footer-input-form-card-two"
                  type="email"
                  id="email"
                  placeholder="Email"
                />

                <h3 class="footer-card-info-title">
                  What would you like to discuss?
                </h3>

                <textarea
                  name="Message"
                  autocomplete="off"
                  placeholder="Message"
                  class="footer-input-form-message"
                  rows="6"
                ></textarea>
              </div>
              <button type="submit" class="btn-submit-block btn-block">
                Submit
              </button>
            </div>
          </div>
        </form>
      </section>
